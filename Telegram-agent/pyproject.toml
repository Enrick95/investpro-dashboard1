[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-followup-assistant"
version = "0.1.0"
description = "Local review queue for Telegram support follow-ups"
requires-python = ">=3.9"
dependencies = ["Telethon>=1.36,<2"]

[project.scripts]
tg-followup = "telegram_followup.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
telegram_followup = ["static/*.html"]

