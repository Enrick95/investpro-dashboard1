var trackTimer=null;
function track(){
  clearTimeout(trackTimer);
  var token=load(SUIVI_KEY),box=document.getElementById('status');
  if(!box)return;
  if(!token){if(S.step==='suivi'){setStatus('','Aucune demande sur ce téléphone','Si tu as envoyé ton dossier depuis un autre appareil, retrouve-le là-bas ou écris à l\'équipe.','<button type="button" class="btn btn-gold" data-action="home">Commencer</button>')}return}
  fetch('/api/vip/nouveau-membre/suivi',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:token}),credentials:'same-origin'}).then(function(r){
    if(r.status===404){store(SUIVI_KEY,'');setStatus('','Demande introuvable','Elle a peut-être été envoyée depuis un autre appareil.','<button type="button" class="btn btn-gold" data-action="home">Envoyer un dossier</button>');return null}
    if(!r.ok)throw 0;return r.json();
  }).then(function(s){
    if(!s)return;
    if(s.status==='submitted'){setStatus('','En cours de vérification','En général sous 24 h. Cette page se met à jour toute seule.','')}
    else if(s.status==='approved'&&s.claimUrl){setStatus('ok','Dossier validé','Crée ton accès avec la même adresse e-mail que ton dossier&#8239;: ton lien vers le canal VIP s\'ouvre juste après.','<a class="btn btn-gold" href="'+esc(s.claimUrl)+'">Créer mon accès</a>');return}
    else if(s.status==='approved'){setStatus('no','Ton lien a expiré','Ton dossier est validé, mais le lien de création a expiré. Écris à l\'équipe&#8239;: on te le renvoie.','<a class="btn btn-gold" href="'+TEAM+'" target="_blank" rel="noopener">Écrire à @EquipeInvestPro</a>');return}
    else if(s.status==='claimed'){store(SUIVI_KEY,'');setStatus('ok','Ton accès est actif','Tu es dans le VIP. Retrouve tes signaux et ton lien Telegram dans ton espace.','<a class="btn btn-gold" href="/dashboard/vip">Ouvrir mon espace VIP</a>');return}
    else if(s.status==='denied'){setStatus('no','Dossier refusé',(s.rejectionReason?'Motif&#8239;: '+esc(s.rejectionReason)+'. ':'')+'Écris à l\'équipe pour corriger, ou envoie un nouveau dossier.','<div class="copyrow"><a class="btn btn-gold" href="'+TEAM+'" target="_blank" rel="noopener">Écrire à @EquipeInvestPro</a><button type="button" class="btn btn-line" data-action="restart">Nouveau dossier</button></div>');return}
    if(!document.hidden)trackTimer=setTimeout(track,20000);
  }).catch(function(){setStatus('','Suivi momentanément indisponible','Ta demande est bien enregistrée. Réessaie dans un instant.','');trackTimer=setTimeout(track,30000)});
}
function setStatus(kind,title,text,actions){
  var box=document.getElementById('status');if(!box)return;
  box.className='status'+(kind?' '+kind:'');
  document.getElementById('status-t').innerHTML=title;document.getElementById('status-p').innerHTML=text;document.getElementById('status-a').innerHTML=actions;
  bindActions(box);
}
document.addEventListener('visibilitychange',function(){if(!document.hidden&&(S.step==='envoye'||S.step==='suivi'))track()});

/* ---------- Interactions ---------- */
function bind(){
  bindActions(app);
  var fc=document.getElementById('f-contact');if(fc)fc.addEventListener('submit',submitContact);
  var fa=document.getElementById('f-account');if(fa){fa.addEventListener('submit',submitAccount);bindFiles();bindRemember(fa)}
  var fd=document.getElementById('f-demo');if(fd){fd.addEventListener('submit',submitDemo);bindRemember(fd)}
  if(fc){bindRemember(fc);var cc=document.getElementById('cc');cc.addEventListener('change',function(){S.cc=cc.value;save();document.getElementById('phone-hint').textContent=S.cc==='autre'?'Écris ton numéro complet avec l\'indicatif, par exemple +44 7…':'Choisis ton pays, puis ton numéro.'})}
}
function bindActions(root){
  root.querySelectorAll('[data-pick]').forEach(function(b){b.addEventListener('click',function(){
    var name=b.getAttribute('data-pick'),v=b.getAttribute('data-value');
    if(name==='path'){
      if(S.path!==v){if(v==='essai'&&ESSAI.indexOf(S.broker)<0)S.broker='';S.path=v}
      go(PATHS[v][0]);
    }else{S.broker=v;go(PATHS[S.path][1])}
  })});
  root.querySelectorAll('[data-go]').forEach(function(b){b.addEventListener('click',function(){go(b.getAttribute('data-go'))})});
  root.querySelectorAll('[data-copy]').forEach(function(b){b.addEventListener('click',function(){copy(b.getAttribute('data-copy'),b)})});
  root.querySelectorAll('[data-action]').forEach(function(b){b.addEventListener('click',function(){
    var a=b.getAttribute('data-action');
    if(a==='back'){var steps=PATHS[S.path]||[],i=steps.indexOf(S.step);go(i>0?steps[i-1]:'depart')}
    else if(a==='home'){go('depart')}
    else if(a==='restart'){store(SUIVI_KEY,'');S.path='';go('depart')}
    else if(a==='copy-page'){copy(location.href,b)}
  })});
}
function copy(text,btn){
  var done=function(){var t=btn.textContent;btn.textContent='Copié';setTimeout(function(){btn.textContent=t},1600)};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done,function(){fallbackCopy(text);done()})}else{fallbackCopy(text);done()}
}
function fallbackCopy(text){var t=document.createElement('textarea');t.value=text;t.setAttribute('readonly','');t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();try{document.execCommand('copy')}catch(e){}document.body.removeChild(t)}
function bindRemember(form){
  form.addEventListener('input',function(e){var el=e.target;if(!el.name||el.type==='file'||el.type==='password'||el.name==='website')return;
    var map={firstName:'firstName',lastName:'lastName',email:'email',phone:'phone',telegram:'telegram',account:'account',server:'server',brokerEmail:'brokerEmail',linkDate:'linkDate',platform:'platform',deposit:'deposit'};
    if(map[el.name]){S[map[el.name]]=el.value;save()}
    if(el.getAttribute('aria-invalid')==='true')clearErr(el.id);
  });
  form.addEventListener('change',function(e){var el=e.target;if(el.type==='radio'){S[el.name]=el.value;save();clearErr(el.name)}if(el.id==='confirm')clearErr('confirm')});
}
function bindFiles(){
  [['capture','deposit'],['captureLink','link']].forEach(function(p){
    var input=document.getElementById(p[0]);if(!input)return;
    input.addEventListener('change',function(){
      var f=input.files&&input.files[0];clearErr(p[0]);
      if(f&&(!/^(image\/(jpeg|png|webp)|application\/pdf)$/.test(f.type)||f.size>8*1048576||f.size<1)){files[p[1]]=null;showErr(p[0],'Choisis une image JPEG, PNG ou WebP, ou un PDF, de 8 Mo maximum.');input.value='';paint(p[0],null);return}
      files[p[1]]=f||null;paint(p[0],files[p[1]]);
    });
  });
  function paint(id,f){var box=document.getElementById(id+'-box');box.classList.toggle('has',!!f);box.querySelector('b').textContent=f?'Capture ajoutée':'Ajouter la capture';document.getElementById(id+'-name').textContent=f?f.name+' ('+size(f.size)+')':'JPEG, PNG, WebP ou PDF, 8 Mo maximum.'}
}
function showErr(id,msg){var e=document.getElementById(id+'-err'),el=document.getElementById(id);if(e){e.textContent=msg;e.hidden=false}if(el&&el.tagName==='INPUT'&&el.type!=='radio'){el.setAttribute('aria-invalid','true');var d=(el.getAttribute('aria-describedby')||'').split(' ').filter(Boolean);if(d.indexOf(id+'-err')<0)d.push(id+'-err');el.setAttribute('aria-describedby',d.join(' '))}}
function clearErr(id){var e=document.getElementById(id+'-err'),el=document.getElementById(id);if(e){e.hidden=true;e.textContent=''}if(el)el.removeAttribute('aria-invalid')}
function firstErr(){var e=app.querySelector('.err:not([hidden])');if(!e)return;var id=e.id.replace(/-err$/,''),el=document.getElementById(id)||app.querySelector('[name="'+id+'"]');if(el&&el.focus)el.focus();else e.scrollIntoView({block:'center'})}

function cleanTelegram(v){return String(v||'').trim().replace(/^https?:\/\//i,'').replace(/^(www\.)?(t|telegram)\.me\//i,'').replace(/^@+/,'').replace(/\/+$/,'')}
function phoneE164(){
  var raw=String(S.phone||'').trim().replace(/[()\s.\-]/g,'');
  if(S.cc==='autre'){raw=raw.replace(/^00/,'+');return /^\+[1-9]\d{7,14}$/.test(raw)?raw:''}
  raw=raw.replace(/^00/,'+');
  if(raw.charAt(0)==='+')return /^\+[1-9]\d{7,14}$/.test(raw)?raw:'';
  raw=raw.replace(/^0+/,'');
  var full=S.cc+raw;return /^\+[1-9]\d{7,14}$/.test(full)?full:'';
}
function submitContact(e){
  e.preventDefault();var ok=true;
  ['firstName','lastName','email','phone','telegram'].forEach(clearErr);
  if(!S.firstName.trim()){showErr('firstName','Écris ton prénom.');ok=false}
  if(!S.lastName.trim()){showErr('lastName','Écris ton nom.');ok=false}
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(S.email.trim())){showErr('email','Vérifie ton adresse e-mail.');ok=false}
  if(!phoneE164()){showErr('phone',S.cc==='autre'?'Écris ton numéro avec l\'indicatif, par exemple +44 7911 123456.':'Ce numéro ne semble pas complet. Vérifie-le.');ok=false}
  if(!/^[A-Za-z][A-Za-z0-9_]{4,31}$/.test(cleanTelegram(S.telegram))){showErr('telegram','Écris ton @pseudo Telegram (5 à 32 caractères, lettres, chiffres ou _).');ok=false}
  if(!ok){firstErr();return}
  S.firstName=S.firstName.trim();S.lastName=S.lastName.trim();S.email=S.email.trim().toLowerCase();S.telegram='@'+cleanTelegram(S.telegram);save();
  go(PATHS[S.path][3]);
}
function needContact(){
  if(!S.firstName.trim()||!S.lastName.trim()||!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(S.email)||!phoneE164()||!/^[A-Za-z][A-Za-z0-9_]{4,31}$/.test(cleanTelegram(S.telegram))){go('coordonnees');return true}
  if(!BROKERS[S.broker]){go('broker');return true}
  return false;
}
function formError(msg){var b=document.getElementById('form-error');b.innerHTML=msg;b.hidden=false;b.scrollIntoView({block:'center',behavior:'smooth'})}
function busy(on,label){var b=document.getElementById('submit');if(!b)return;b.disabled=on;if(label)b.textContent=label}
function submitAccount(e){
  e.preventDefault();if(needContact())return;
  var link=S.path==='rattachement',ok=true,form=e.target;
  document.getElementById('form-error').hidden=true;
  ['platform','account','server','deposit','capture','captureLink','brokerEmail','confirm'].forEach(clearErr);
  if(['MT4','MT5'].indexOf(S.platform)<0){showErr('platform','Choisis MT4 ou MT5.');ok=false}
  if(!/^\d{4,12}$/.test(S.account.trim())){showErr('account','Le numéro de compte contient 4 à 12 chiffres.');ok=false}
  if(S.server.trim().length<2){showErr('server','Écris le nom du serveur.');ok=false}
  if(!S.deposit){showErr('deposit','Choisis le montant de ton dépôt.');ok=false}
  if(!files.deposit){showErr('capture','Ajoute la capture de ton dépôt.');ok=false}
  if(link){
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test((S.brokerEmail||S.email).trim())){showErr('brokerEmail','Vérifie l\'adresse e-mail de ton compte broker.');ok=false}
    if(!files.link){showErr('captureLink','Ajoute la capture de la confirmation du rattachement.');ok=false}
  }
  if(!document.getElementById('confirm').checked){showErr('confirm',link?'Confirme que le broker a rattaché ton compte.':'Confirme que tu as ouvert le compte avec le lien d\'Enrick.');ok=false}
  if(!ok){firstErr();return}
  var fd=new FormData();
  fd.set('firstName',S.firstName);fd.set('lastName',S.lastName);fd.set('email',S.email);fd.set('telWhatsapp',phoneE164());fd.set('telegram',cleanTelegram(S.telegram));
  fd.set('broker',S.broker);fd.set('plateforme',S.platform);fd.set('compteMT',S.account.trim());fd.set('serveur',S.server.trim());fd.set('depot',S.deposit);fd.set('viaEnrick','true');
  fd.set('typeCompte',link?'rattachement':'nouveau');fd.set('capture',files.deposit);fd.set('website',form.elements.website.value||'');
  if(link){fd.set('emailBroker',(S.brokerEmail||S.email).trim().toLowerCase());if(S.linkDate)fd.set('dateRattachement',S.linkDate);fd.set('captureRattachement',files.link)}
  busy(true,'Envoi en cours…');
  fetch('/api/vip/nouveau-membre/demande',{method:'POST',body:fd,credentials:'same-origin'}).then(function(r){return r.json().catch(function(){return {}}).then(function(j){return {status:r.status,body:j}})}).then(function(res){
    if((res.status===201||res.status===200)&&res.body&&res.body.ok){
      if(res.body.suiviToken)store(SUIVI_KEY,res.body.suiviToken);
      sent={kind:S.path,firstName:S.firstName,email:S.email};finish();return;
    }
    busy(false,'Envoyer mon dossier');
    var msg=res.body&&res.body.error?esc(res.body.error):'L\'envoi n\'a pas marché. Réessaie dans un instant.';
    if(res.status===409&&load(SUIVI_KEY))msg+=' <button type="button" class="btn btn-line btn-sm" data-go="suivi" style="margin-top:10px">Voir où en est ma demande</button>';
    else if(res.status===409)msg+=' Écris à <a href="'+TEAM+'" target="_blank" rel="noopener">@EquipeInvestPro</a> si tu penses que c\'est une erreur.';
    formError(msg);bindActions(document.getElementById('form-error'));
  }).catch(function(){busy(false,'Envoyer mon dossier');formError('La connexion a coupé. Vérifie ton réseau et réessaie&#8239;: rien n\'a été perdu.')});
}
function submitDemo(e){
  e.preventDefault();if(needContact())return;
  var form=e.target,ok=true,pw=document.getElementById('password').value;
  document.getElementById('form-error').hidden=true;
  ['account','server','password','confirm'].forEach(clearErr);
  if(!S.account.trim()){showErr('account','Écris le numéro de ton compte démo.');ok=false}
  if(!S.server.trim()){showErr('server','Écris le nom du serveur.');ok=false}
  if(!pw){showErr('password','Écris le mot de passe de ton compte démo.');ok=false}
  if(!document.getElementById('confirm').checked){showErr('confirm','Confirme que c\'est un compte démo.');ok=false}
  if(!ok){firstErr();return}
  busy(true,'Envoi en cours…');
  fetch('/api/essai-vip',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({prenom:S.firstName,nomFamille:S.lastName,email:S.email,telephone:phoneE164(),telegram:'@'+cleanTelegram(S.telegram),broker:BROKERS[S.broker].essai,compte:S.account.trim(),serveur:S.server.trim(),motdepasse:pw,confirmeDemo:true,website:form.elements.website.value||''})})
  .then(function(r){return r.json().catch(function(){return {}}).then(function(j){return {status:r.status,body:j}})}).then(function(res){
    if(res.status===200&&res.body&&res.body.ok){document.getElementById('password').value='';sent={kind:'essai',firstName:S.firstName,email:S.email};finish();return}
    busy(false,'Envoyer ma demande d\'essai');
    if(res.body&&res.body.error==='contact'){formError('Ton WhatsApp ou ton Telegram ne passe pas. <button type="button" class="btn btn-line btn-sm" data-go="coordonnees" style="margin-top:10px">Corriger mes coordonnées</button>');bindActions(document.getElementById('form-error'));return}
    if(res.status===429){formError('Trop de tentatives d\'un coup. Attends une minute et réessaie.');return}
    formError('L\'envoi n\'a pas marché. Réessaie dans un instant, ou écris à <a href="'+TEAM+'" target="_blank" rel="noopener">@EquipeInvestPro</a> avec ton prénom et ton broker (jamais ton mot de passe).');
  }).catch(function(){busy(false,'Envoyer ma demande d\'essai');formError('La connexion a coupé. Vérifie ton réseau et réessaie.')});
}
function finish(){
  var keep={cc:S.cc};
  ['path','broker','firstName','lastName','email','phone','telegram','platform','account','server','deposit','brokerEmail','linkDate'].forEach(function(k){S[k]=''});
  S.cc=keep.cc;files={deposit:null,link:null};store(DRAFT_KEY,'');
  go('envoye',true);
}

// Premier affichage
var hash=location.hash.replace('#','');
if(hash==='suivi')S.step='suivi';
else if(hash&&S.path&&PATHS[S.path].indexOf(hash)>=0)S.step=hash;
else if(!q&&!hash&&S.step!=='depart'&&S.path){/* reprise du brouillon à l'étape enregistrée */}
if(S.step==='envoye')S.step='depart';
try{history.replaceState({step:S.step,path:S.path},'',location.pathname+(S.step==='depart'?'':'#'+S.step))}catch(e){}
render(false);
})();
</script>
