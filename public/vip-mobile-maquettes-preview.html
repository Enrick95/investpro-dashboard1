    };

  };

    postToHost(&quot;height&quot;, {
      height: Math.ceil(

        ),

    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);

              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */

              }

      }
      hostPort = nextHostPort;

    }

  function bottom(s){return `&lt;nav class=&quot;ip-bottom&quot; aria-label=&quot;Navigation de l’application&quot;&gt;&lt;button data-action=&quot;secondary&quot; data-value=&quot;Mon journal&quot;&gt;${ico(&#x27;book-open&#x27;)}Journal&lt;/button&gt;&lt;button data-action=&quot;secondary&quot; data-value=&quot;Mes rapports&quot;&gt;${ico(&#x27;chart-column&#x27;)}Rapports&lt;/button&gt;&lt;button class=&quot;active&quot; data-action=&quot;home&quot;&gt;${ico(&#x27;crown&#x27;)}VIP&lt;/button&gt;&lt;button data-action=&quot;secondary&quot; data-value=&quot;Mon profil&quot;&gt;${ico(&#x27;user-round&#x27;)}Profil&lt;/button&gt;&lt;/nav&gt;`;}
  function secondaryRows(){return `&lt;div class=&quot;ip-secondary-grid&quot;&gt;&lt;button data-action=&quot;secondary&quot; data-value=&quot;Partenariats&quot;&gt;Partenariats ${ico(&#x27;arrow-up-right&#x27;)}&lt;/button&gt;&lt;button data-action=&quot;secondary&quot; data-value=&quot;Performances VIP&quot;&gt;Performances VIP&lt;/button&gt;&lt;button data-action=&quot;secondary&quot; data-value=&quot;Formation &amp; coaching&quot;&gt;Formation · Bientôt&lt;/button&gt;&lt;button data-action=&quot;secondary&quot; data-value=&quot;Telegram&quot;&gt;Telegram ${ico(&#x27;arrow-up-right&#x27;)}&lt;/button&gt;&lt;/div&gt;`;}

t;ip-readonly&quot;&gt;&#x27;+ico(&#x27;lock-keyhole&#x27;)+&#x27; Seule l’équipe peut publier dans ce canal&lt;/div&gt;&#x27;:&#x27;&#x27;}${!s.composition?bottom(s):&#x27;&#x27;}${s.drawer?drawer(s):&#x27;&#x27;}&lt;/article&gt;&lt;/div&gt;`;

    if(action===&#x27;toggle-details&#x27;)s.details=!s.details;
    if(action===&#x27;preview&#x27;)s.preview=true;

    render(section);remember(section);

  });
  root.addEventListener(&#x27;keydown&#x27;,event=&gt;{
    const section=event.target.closest(&#x27;[data-layout]&#x27;);
    if(!section)return;
    const s=states.get(section);

      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  frame.srcdoc = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  delete frame.dataset.srcdoc;
})();
</script>
</body>
</html>
