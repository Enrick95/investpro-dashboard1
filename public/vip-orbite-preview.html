(() =&gt; {
  const root = document.getElementById(&#x27;investpro-vip-orbite&#x27;);
  const defaults = { screen: &#x27;welcome&#x27;, filter: &#x27;all&#x27;, active: true, alerts: false, account: &#x27;new&#x27; };
  let state = { ...defaults };
  const screens = [&#x27;welcome&#x27;,&#x27;activate&#x27;,&#x27;feed&#x27;,&#x27;admin&#x27;];
  function applySaved(snapshot) {
    const saved = snapshot &amp;&amp; snapshot.privateContent;

      state = { ...defaults, ...saved, screen: screens.includes(saved.screen) ? saved.screen : &#x27;welcome&#x27; };
    }

  applySaved(window.openai &amp;&amp; window.openai.widgetState);
  function save() {
    if (window.openai &amp;&amp; window.openai.setWidgetState) {
      window.openai.setWidgetState({ modelContent: { proposal:&#x27;Canal VIP InvestPro · Orbite&#x27;,screen:state.screen }, privateContent: { ...state } }).catch(() =&gt; {});
    }
  }
  function render() {
    root.querySelectorAll(&#x27;[data-panel]&#x27;).forEach(el =&gt; { el.hidden = el.dataset.panel !== state.screen; });
    root.querySelectorAll(&#x27;[data-screen]&#x27;).forEach(el =&gt; el.setAttribute(&#x27;aria-pressed&#x27;, String(el.dataset.screen === state.screen)));
    root.querySelectorAll(&#x27;[data-filter]&#x27;).forEach(el =&gt; el.setAttribute(&#x27;aria-pressed&#x27;, String(el.dataset.filter === state.filter)));
    root.querySelectorAll(&#x27;[data-kind]&#x27;).forEach(el =&gt; { el.hidden = state.filter !== &#x27;all&#x27; &amp;&amp; el.dataset.kind !== state.filter; });
    root.querySelectorAll(&#x27;[data-account]&#x27;).forEach(el =&gt; el.setAttribute(&#x27;aria-pressed&#x27;,String(el.dataset.account === state.account)));
    root.querySelector(&#x27;.ip-names&#x27;).hidden = state.account === &#x27;existing&#x27;;
    root.querySelector(&#x27;#ip-activate-label&#x27;).textContent = state.account === &#x27;existing&#x27; ? &#x27;Me connecter et activer le VIP&#x27; : &#x27;Continuer vers mon compte&#x27;;

  root.querySelectorAll(&#x27;[data-account]&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;,() =&gt; {
    state.account = button.dataset.account; render(); save();

  });
  root.querySelector(&#x27;#ip-install&#x27;).addEventListener(&#x27;click&#x27;,() =&gt; {
    const guide = root.querySelector(&#x27;#ip-install-guide&#x27;); guide.hidden = !guide.hidden;

  });
  root.querySelector(&#x27;#ip-telegram-button&#x27;).addEventListener(&#x27;click&#x27;,() =&gt; {
    const message = root.querySelector(&#x27;#ip-telegram-result&#x27;); message.hidden = false;
    message.textContent = &#x27;Aperçu : Telegram s’ouvrirait pour demander l’adhésion au canal. L’équipe vérifierait et accepterait votre demande manuellement. Aucun message n’est envoyé dans cette démonstration.&#x27;;
  });
  root.querySelectorAll(&#x27;.ip-reaction&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;,() =&gt; {
    const reacted = button.getAttribute(&#x27;aria-pressed&#x27;) !== &#x27;true&#x27;;
    button.setAttribute(&#x27;aria-pressed&#x27;,String(reacted)); button.querySelector(&#x27;span&#x27;).textContent = reacted ? &#x27;Réaction ajoutée&#x27; : &#x27;Réagir&#x27;;
  }));
  root.querySelector(&#x27;#ip-invite&#x27;).addEventListener(&#x27;click&#x27;,() =&gt; {
    root.querySelector(&#x27;#ip-invite-result&#x27;).hidden = false;
    root.querySelector(&#x27;#ip-admin-origin&#x27;).textContent = root.querySelector(&#x27;#ip-access-type&#x27;).value;
    root.querySelector(&#x27;#ip-admin-expiry&#x27;).textContent = root.querySelector(&#x27;#ip-access-end&#x27;).value;
  });
  root.querySelector(&#x27;#ip-revoke&#x27;).addEventListener(&#x27;click&#x27;,() =&gt; {
    state.active = !state.active; if (!state.active) state.alerts = false; render(); save();
  });
  window.addEventListener(&#x27;openai:set_globals&#x27;,event =&gt; {
    const globals = event.detail &amp;&amp; event.detail.globals;
    if (globals &amp;&amp; globals.widgetState) { applySaved(globals.widgetState); render(); }
  });
  const design = { showBenefits:true };
  if (globalThis.Tweak) {
    const tweak = new Tweak({container:root.querySelector(&#x27;.ip-welcome&#x27;),onChange:() =&gt; {root.querySelector(&#x27;.ip-benefits&#x27;).hidden = !design.showBenefits;}});
    tweak.addToggle(design,&#x27;showBenefits&#x27;,{label:&#x27;Présenter les avantages sur l’accueil&#x27;});
  }
  render();
})();
