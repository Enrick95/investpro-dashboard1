    {id:2,category:'Analyse',title:'Le contexte avant le scénario',text:'Une lecture simple du marché avant la session. Le graphique peut accompagner le texte, ou être publié seul.',time:'08:40',counts:[4,1,0]},
    {id:3,category:'Signal',title:'XAUUSD · Exemple de signal',text:'Actif, scénario, invalidation et objectifs peuvent accompagner le signal. Tous les contenus de cette maquette sont fictifs.',image:sampleImage,time:'10:42',counts:[5,2,1]},
    {id:4,category:'Bilan',title:'Le bilan de la session',text:'Un espace pour les récapitulatifs, les enseignements et les captures partagées avec le groupe. Aucun résultat réel dans cet exemple.',time:'18:10',counts:[8,2,3]},
    {id:5,category:'Suivi',title:'XAUUSD · Mise à jour',text:'Le scénario évolue : retrouve ici les nouvelles observations de l’équipe et les captures de suivi.',time:'11:08',counts:[3,1,0]},
    {id:6,category:'Partenariat',title:'Les avantages du cercle',text:'Les présentations des partenaires et les conditions de chaque offre seront regroupées dans cette rubrique.',time:'Hier',counts:[2,0,1]}
  ];
  const state={view:'member',category:'Analyse',preview:false,titleOpen:false,title:'',text:'Voici mon analyse de la session. Je partage les zones importantes et le contexte sur ce graphique.',draftCategory:'Analyse',image:null,imageName:'',error:'',busy:false,reactions:{}};
  let activeReader=null,readId=0,toastTimer=null,viewerTrigger=null,nextId=20;
  const currentCategory=()=>categories.find(c=>c.id===state.category)||categories[0];
  function refreshIcons(){if(globalThis.lucide)lucide.createIcons({attrs:{width:18,height:18}});}
  function toast(message){clearTimeout(toastTimer);toastEl.textContent=message;toastEl.hidden=false;toastTimer=setTimeout(()=>toastEl.hidden=true,4200);}
  function rail(){return `<nav class="rc-rail" aria-label="Rubriques VIP">${categories.map(c=>`<button type="button" data-category="${c.id}" class="${state.category===c.id?'active':''}" aria-pressed="${state.category===c.id}" ${c.id==='Formation'?'aria-label="Formation et coaching, bientôt"':''}>${icon(c.icon)}<span>${c.name}</span></button>`).join('')}</nav>`;}
  function reactionBar(post,preview=false){return `<div class="rc-react" aria-label="Réactions à la publication">${reactions.map((r,i)=>{const selected=!preview&&state.reactions[post.id]===i;return `<button type="button" class="rc-reaction" ${preview?'disabled':`data-react="${i}" data-post="${post.id}"`} aria-label="${esc(r.name)}, ${(post.counts?.[i]||0)+(selected?1:0)} réactions" aria-pressed="${selected}"><span aria-hidden="true">${r.emoji}</span><span>${(post.counts?.[i]||0)+(selected?1:0)}</span></button>`;}).join('')}</div>`;}
  function card(post,preview=false){return `<article class="rc-post"><div class="rc-post-copy"><div class="rc-byline"><span class="rc-avatar">${icon('crown')}</span><span class="rc-author">InvestPro<small>${esc(post.time)} · Exemple</small></span><span class="rc-badge">${esc(categories.find(c=>c.id===post.category)?.name||post.category)}</span></div><h2>${esc(post.title)}</h2>${post.text?`<p class="rc-message">${esc(post.text)}</p>`:''}</div>${post.image?`<button type="button" class="rc-photo" data-image="${post.id}" aria-label="Agrandir le graphique de ${esc(post.title)}"><img src="${esc(post.image)}" alt="${esc(post.imageName||'Graphique illustratif ajouté à la publication')}" loading="lazy"><span class="rc-photo-hint">${icon('expand')}Agrandir le graphique</span></button>`:''}${reactionBar(post,preview)}${preview?'<div class="rc-reactions-label">Les membres pourront réagir ici.</div>':''}</article>`;}
  function member(){const c=currentCategory();let inner='';if(c.id==='Formation')inner=`<div class="rc-empty"><span class="rc-emblem">${icon('graduation-cap')}</span><span class="rc-kicker">Bientôt</span><h2>Formation & coaching</h2><p>Un nouvel espace pour apprendre et progresser avec le cercle privé.</p></div>`;else if(c.id==='Telegram')inner=`<div class="rc-empty"><span class="rc-emblem">${icon('send')}</span><h2>Le canal privé.</h2><p>Retrouve aussi la communauté sur Telegram depuis cet espace.</p><button type="button" class="rc-button" data-telegram>${icon('send')}Rejoindre le canal</button></div>`;else inner=`<div class="rc-date">Publications · Démonstration</div>${posts.filter(p=>p.category===c.id).map(p=>card(p)).join('')}<div class="rc-note">${icon('shield-check')}Seule l’équipe publie. Les membres peuvent réagir.</div>`;return `${rail()}<main class="rc-content"><span class="rc-kicker">Le cercle privé</span><h1>${c.title}</h1><p class="rc-lead">${c.sub}</p>${inner}</main>`;}
  function draftPost(){const name=categories.find(c=>c.id===state.draftCategory)?.name||'Publication';return {id:0,category:state.draftCategory,title:state.title.trim()||({Analyse:'Mon analyse graphique',Signal:'Nouveau signal',Bilan:'Le bilan de la session',Suivi:'Mise à jour du scénario',Partenariat:'Nouveau partenariat'}[state.draftCategory]||name),text:state.text.trim(),image:state.image,imageName:state.imageName,time:'À l’instant',counts:[0,0,0]};}
  function admin(){if(state.preview)return `<section class="rc-admin"><div class="rc-admin-scroll"><button type="button" class="rc-back" data-edit>${icon('arrow-left')}Revenir à la rédaction</button><span class="rc-kicker">Comme le verront les membres</span><h1>L’aperçu.</h1><p class="rc-lead">Destination : ${esc(categories.find(c=>c.id===state.draftCategory)?.name)}.</p>${card(draftPost(),true)}<div class="rc-note">${icon('info')}Simulation : cette publication reste dans la maquette.</div></div><div class="rc-admin-actions"><button type="button" class="rc-button secondary" data-edit>${icon('pen-line')}Modifier</button><button type="button" class="rc-button" data-publish>${icon('send')}Publier · démo</button></div></section>`;
  return `<section class="rc-admin"><div class="rc-admin-scroll"><span class="rc-kicker">Admin VIP · Publication</span><h1>Partager au cercle.</h1><p class="rc-lead">Ton texte, ton graphique. C’est tout.</p><label class="rc-field">Publier dans<select id="rc-category">${categories.filter(c=>!['Formation','Telegram'].includes(c.id)).map(c=>`<option value="${c.id}" ${state.draftCategory===c.id?'selected':''}>${c.name}</option>`).join('')}</select></label><label class="rc-field">Ton message <textarea id="rc-message" placeholder="Ton analyse, ton signal, ton bilan…" maxlength="3000">${esc(state.text)}</textarea></label><div class="rc-media-label">Graphique ou photo <span style="color:#85977a">· facultatif</span></div>${state.image?`<div class="rc-attachment"><img src="${esc(state.image)}" alt="Aperçu du graphique ou de la photo sélectionnée"><div class="rc-attachment-info">${icon('image')}<span>${esc(state.imageName)}</span></div><div class="rc-media-actions"><button type="button" data-pick>Remplacer</button><button type="button" data-remove-image>Retirer</button></div></div>`:`<button type="button" class="rc-attach" data-pick ${state.busy?'disabled':''}>${icon('image-plus')}<strong>${state.busy?'Lecture de l’image…':'Ajouter un graphique ou une photo'}</strong><small>JPG, PNG, WebP ou GIF · 10 Mo max</small></button><button type="button" class="rc-example" data-example>${icon('chart-no-axes-combined')}Essayer avec un graphique</button>`}${state.error?`<div class="rc-error" role="alert">${esc(state.error)}</div>`:''}<button type="button" class="rc-optional" data-title-toggle>${icon(state.titleOpen?'minus':'plus')}${state.titleOpen?'Masquer le titre':'Ajouter un titre (facultatif)'}</button>${state.titleOpen?`<label class="rc-field">Titre<input id="rc-title" maxlength="120" value="${esc(state.title)}" placeholder="Ex. XAUUSD · Plan de session"></label>`:''}<div class="rc-note">${icon('image')}L’image s’affiche entière et les membres peuvent l’agrandir.</div></div><div class="rc-admin-actions"><button type="button" class="rc-button secondary" data-preview ${state.busy?'disabled':''}>${icon('eye')}Aperçu</button><button type="button" class="rc-button" data-publish ${state.busy?'disabled':''}>${icon('send')}Publier · démo</button></div></section>`;}
  function render(){body.innerHTML=state.view==='admin'?admin():member();root.querySelector('#rc-header-sub').textContent=state.view==='admin'?'Espace de publication':'Le cercle privé';root.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===state.view)));refreshIcons();}
  function syncDraft(){const message=root.querySelector('#rc-message');const title=root.querySelector('#rc-title');const category=root.querySelector('#rc-category');if(message)state.text=message.value;if(title)state.title=title.value;if(category)state.draftCategory=category.value;}
  function validDraft(){syncDraft();if(!state.text.trim()&&!state.image){state.error='Ajoute un message, une image, ou les deux.';render();return false;}state.error='';return true;}
  function clearPending(){readId++;if(activeReader?.readyState===FileReader.LOADING)activeReader.abort();activeReader=null;state.busy=false;}
  function openImage(post,trigger){if(!post?.image)return;viewerTrigger=trigger;viewerImg.src=post.image;viewerImg.alt=post.imageName||'Graphique illustratif de la publication';viewer.hidden=false;root.querySelector('[data-close-image]').focus();}
  function closeImage(){viewer.hidden=true;viewerImg.removeAttribute('src');viewerTrigger?.focus();viewerTrigger=null;}
  picker.addEventListener('change',()=>{
    const file=picker.files?.[0];if(!file)return;syncDraft();clearPending();state.error='';
    if(!['image/jpeg','image/png','image/webp','image/gif'].includes(file.type)){state.error='Choisis une image JPG, PNG, WebP ou GIF. Pour une photo HEIC d’iPhone, exporte-la en JPG.';picker.value='';render();return;}
    if(file.size>10*1024*1024){state.error='Cette image dépasse 10 Mo. Choisis une capture plus légère.';picker.value='';render();return;}
    const thisRead=readId;state.busy=true;render();const reader=new FileReader();activeReader=reader;
    reader.onerror=()=>{if(thisRead!==readId)return;state.busy=false;state.error='Impossible de lire cette image. Essaie avec une autre capture.';picker.value='';render();};
    reader.onload=()=>{if(thisRead!==readId)return;const img=new Image();img.onload=()=>{if(thisRead!==readId)return;state.image=String(reader.result);state.imageName=file.name;state.busy=false;activeReader=null;picker.value='';render();};img.onerror=()=>{if(thisRead!==readId)return;state.busy=false;state.error='Le navigateur ne peut pas afficher ce fichier. Essaie une capture PNG ou JPG.';picker.value='';render();};img.src=String(reader.result);};reader.readAsDataURL(file);
  });
  root.addEventListener('input',event=>{if(event.target.id==='rc-message')state.text=event.target.value;if(event.target.id==='rc-title')state.title=event.target.value;});
  root.addEventListener('change',event=>{if(event.target.id==='rc-category')state.draftCategory=event.target.value;});
  root.addEventListener('click',event=>{
    const button=event.target.closest('button');if(!button)return;
    if(button.hasAttribute('data-view')){syncDraft();state.view=button.dataset.view;state.preview=false;render();return;}
    if(button.hasAttribute('data-category')){state.category=button.dataset.category;render();return;}
    if(button.hasAttribute('data-home')){state.view='member';state.category='Analyse';render();return;}
    if(button.hasAttribute('data-tool')){toast(`${button.dataset.tool} reste accessible depuis le site. Cette page est une maquette du VIP.`);return;}
    if(button.hasAttribute('data-telegram')){toast('Le bouton ouvrirait ton canal privé Telegram. Aucun lien réel dans cette maquette.');return;}
    if(button.hasAttribute('data-pick')){syncDraft();picker.click();return;}
    if(button.hasAttribute('data-example')){syncDraft();clearPending();state.image=sampleImage;state.imageName='Analyse-XAUUSD-exemple.svg';state.error='';render();return;}
    if(button.hasAttribute('data-remove-image')){syncDraft();clearPending();state.image=null;state.imageName='';picker.value='';state.error='';render();return;}
    if(button.hasAttribute('data-title-toggle')){syncDraft();state.titleOpen=!state.titleOpen;render();return;}
    if(button.hasAttribute('data-preview')){if(validDraft()){state.preview=true;render();}return;}
    if(button.hasAttribute('data-edit')){state.preview=false;render();return;}
    if(button.hasAttribute('data-publish')){if(!validDraft())return;const post={...draftPost(),id:nextId++};posts.unshift(post);state.view='member';state.category=post.category;state.preview=false;state.text='';state.title='';state.image=null;state.imageName='';state.titleOpen=false;render();toast('Publication ajoutée à la maquette. Aucun envoi réel.');return;}
    if(button.hasAttribute('data-react')){const postId=Number(button.dataset.post),reaction=Number(button.dataset.react);state.reactions[postId]=state.reactions[postId]===reaction?null:reaction;const scroll=root.querySelector('.rc-content')?.scrollTop||0;render();const content=root.querySelector('.rc-content');if(content)content.scrollTop=scroll;root.querySelector(`[data-post="${postId}"][data-react="${reaction}"]`)?.focus({preventScroll:true});return;}
    if(button.hasAttribute('data-image')){openImage(Number(button.dataset.image)===0?draftPost():posts.find(p=>p.id===Number(button.dataset.image)),button);return;}
    if(button.hasAttribute('data-close-image'))closeImage();
  });
  root.addEventListener('keydown',event=>{if(viewer.hidden)return;if(event.key==='Escape'){event.preventDefault();closeImage();}if(event.key==='Tab'){event.preventDefault();root.querySelector('[data-close-image]').focus();}});
  render();
})();
</script>
